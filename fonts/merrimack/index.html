<h1>Merrimack: font options</h1><p>Mary said the current font feels too business-like. Same page, same colours and photo, only the type changes. Number 1 is the current font, for comparison. Pick one, or say which two to compare bigger.</p>

ACK<br>COMMONS</span><span class="lg">EN ES HT PT</span></div><h2 style="font-family:var(--d);font-weight:900;font-variation-settings:"SOFT" 100,"WONK" 1,"opsz" 144">Free.<br>Public.<br>Yours.</h2></div><div class="band"><p>Merrimack Commons Charter School · K-8 · Lawrence</p><a class="pill">Apply for 2027-28</a></div><div class="k8"><h3 style="font-family:var(--d);font-weight:900;font-variation-settings:"SOFT" 100,"WONK" 1,"opsz" 144">K-8.<br>Free.<br>No test.</h3></div><div class="row"><b style="font-family:var(--d);font-weight:900;font-variation-settings:"SOFT" 100,"WONK" 1,"opsz" 144">Report an absence</b><span>Text or call before 9 AM</span></div></div><figcaption><b>3. Fraunces (soft)</b> A soft, wonky serif: storybook and friendly, still poster-sized.</figcaption></figure><figure class="c"><div class="ph" style="--d:"Lilita One";--b:Figtree"><div class="hero"><div class="top"><span class="wm" style="font-family:var(--d);font-weight:400">MERRIMACK<br>COMMONS</span><span class="lg">EN ES HT PT</span></div><h2 style="font-family:var(--d);font-weight:400">Free.<br>Public.<br>Yours.</h2></div><div class="band"><p>Merrimack Commons Charter School · K-8 · Lawrence</p><a class="pill">Apply for 2027-28</a></div><div class="k8"><h3 style="font-family:var(--d);font-weight:400">K-8.<br>Free.<br>No test.</h3></div><div class="row"><b style="font-family:var(--d);font-weight:400">Report an absence</b><span>Text or call before 9 AM</span></div></div><figcaption><b>4. Lilita One</b> Chunky, rounded, upbeat. Reads like a school sign.</figcaption></figure><figure class="c"><div class="ph" style="--d:"Bagel Fat One";--b:Figtree"><div class="hero"><div class="top"><span class="wm" style="font-family:var(--d);font-weight:400">MERRIMACK<br>COMMONS</span><span class="lg">EN ES HT PT</span></div><h2 style="font-family:var(--d);font-weight:400">Free.<br>Public.<br>Yours.</h2></div><div class="band"><p>Merrimack Commons Charter School · K-8 · Lawrence</p><a class="pill">Apply for 2027-28</a></div><div class="k8"><h3 style="font-family:var(--d);font-weight:400">K-8.<br>Free.<br>No test.</h3></div><div class="row"><b style="font-family:var(--d);font-weight:400">Report an absence</b><span>Text or call before 9 AM</span></div></div><figcaption><b>5. Bagel Fat One</b> Fat and bubbly: the most playful of the set.</figcaption></figure><figure class="c"><div class="ph" style="--d:"Fredoka";--b:Fredoka"><div class="hero"><div class="top"><span class="wm" style="font-family:var(--d);font-weight:700;font-stretch:80%">MERRIMACK<br>COMMONS</span><span class="lg">EN ES HT PT</span></div><h2 style="font-family:var(--d);font-weight:700;font-stretch:80%">Free.<br>Public.<br>Yours.</h2></div><div class="band"><p>Merrimack Commons Charter School · K-8 · Lawrence</p><a class="pill">Apply for 2027-28</a></div><div class="k8"><h3 style="font-family:var(--d);font-weight:700;font-stretch:80%">K-8.<br>Free.<br>No test.</h3></div><div class="row"><b style="font-family:var(--d);font-weight:700;font-stretch:80%">Report an absence</b><span>Text or call before 9 AM</span></div></div><figcaption><b>6. Fredoka</b> Rounded, gentle and kid-friendly, still easy to read.</figcaption></figure><figure class="c"><div class="ph" style="--d:"Bowlby One";--b:Figtree"><div class="hero"><div class="top"><span class="wm" style="font-family:var(--d);font-weight:400">MERRIMACK<br>COMMONS</span><span class="lg">EN ES HT PT</span></div><h2 style="font-family:var(--d);font-weight:400">Free.<br>Public.<br>Yours.</h2></div><div class="band"><p>Merrimack Commons Charter School · K-8 · Lawrence</p><a class="pill">Apply for 2027-28</a></div><div class="k8"><h3 style="font-family:var(--d);font-weight:400">K-8.<br>Free.<br>No test.</h3></div><div class="row"><b style="font-family:var(--d);font-weight:400">Report an absence</b><span>Text or call before 9 AM</span></div></div><figcaption><b>7. Bowlby One</b> Heavy and blocky but friendly, like a gym banner.</figcaption></figure><figure class="c"><div cla
